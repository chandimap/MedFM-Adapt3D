name: CI


on:
  push:
  pull_request:


jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install CPU PyTorch
        run: >
          python -m pip install
          torch==2.13.0
          --index-url https://download.pytorch.org/whl/cpu

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Validate research contract
        run: python scripts/validate_research_contract.py

      - name: Validate preprocessing contract
        run: python scripts/validate_preprocessing_contract.py
