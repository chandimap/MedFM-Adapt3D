name: CI


on:
  push:
  pull_request:


jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install CPU PyTorch
        run: >
          python -m pip install
          torch==2.13.0
          --index-url https://download.pytorch.org/whl/cpu

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Check dependency consistency
        run: python -m pip check

      - name: Lint
        run: ruff check .

      - name: Compile Python sources
        run: python -m compileall -q src scripts tests

      - name: Test
        run: pytest

      - name: Validate research contract
        run: python scripts/validate_research_contract.py

      - name: Validate preprocessing contract
        run: python scripts/validate_preprocessing_contract.py

      - name: Validate random baseline scientific contract
        run: python scripts/validate_random_baseline_contract.py

      - name: Exercise synthetic baseline end-to-end
        run: python scripts/smoke_random_baseline.py
