name: CI


on:
  push:
  pull_request:


jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install CPU PyTorch
        run: >
          python -m pip install
          torch==2.13.0
          --index-url https://download.pytorch.org/whl/cpu

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Check dependency consistency
        run: python -m pip check

      - name: Lint
        run: ruff check .

      - name: Compile Python sources
        run: python -m compileall -q src scripts tests

      - name: Test
        run: pytest

      - name: Validate research contract
        run: python scripts/validate_research_contract.py

      - name: Validate preprocessing contract
        run: python scripts/validate_preprocessing_contract.py

      - name: Validate random baseline scientific contract
        run: python scripts/validate_random_baseline_contract.py

      - name: Exercise synthetic baseline end-to-end
        run: python scripts/smoke_random_baseline.py

      - name: Validate frozen representation provenance and claim limits
        run: python scripts/validate_frozen_representation_contract.py

      - name: Verify published feature-adaptation evidence
        run: python scripts/validate_feature_evidence.py

      - name: Retrieve pinned official SuPreM checkpoint
        shell: bash
        run: |
          mkdir -p checkpoints
          curl --fail --location --retry 3 --output checkpoints/supervised_suprem_segresnet_2100.pth \
            'https://huggingface.co/MrGiovanni/SuPreM/resolve/46ab78c25b07ace573177ebffd02214f670c7e4f/supervised_suprem_segresnet_2100.pth?download=true'

      - name: Exercise all four feature arms with the verified checkpoint
        run: >
          python -m medfm_adapt3d.foundation.feature_experiment
          --checkpoint checkpoints/supervised_suprem_segresnet_2100.pth
          --output outputs/feature_ci

      - name: Check live optimizer, selected checkpoint and isolation evidence
        run: python scripts/validate_feature_evidence.py --live outputs/feature_ci
